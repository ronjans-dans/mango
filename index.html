<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplayer Verhalen Game</title>
<style>
body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#090018;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh}
#app{width:95%;max-width:900px;background:rgba(0,0,0,0.6);border-radius:18px;padding:20px;box-shadow:0 0 40px rgba(0,255,255,0.15)}
h1{text-align:center;margin-bottom:15px;color:#00ffee}
#story{background:#050505;border-radius:14px;padding:15px;min-height:300px;max-height:420px;overflow-y:auto;font-size:18px;line-height:1.6;box-shadow:inset 0 0 20px rgba(0,255,255,0.1)}
.line{margin-bottom:10px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#controls{display:flex;gap:10px;margin-top:15px}
input{flex:1;padding:12px 14px;border-radius:10px;border:none;outline:none;font-size:16px}
button{padding:12px 20px;border:none;border-radius:10px;background:linear-gradient(90deg,#00ffee,#00ff99);font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.1)}
#status{text-align:center;font-size:12px;margin-top:6px;opacity:.7}
</style>
</head>
<body>

<div id="app">
<h1>📖 Multiplayer Verhalen Game</h1>
<div id="story"></div>
<div id="controls">
<input id="name" placeholder="Jouw naam" maxlength="20">
<input id="text" placeholder="Schrijf jouw zin..." maxlength="140">
<button id="sendBtn">Verstuur</button>
</div>
<div id="status">Offline modus (werkt direct)</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<script>
// --- CONFIGURATIE ---
// Vervang met jouw Firebase gegevens als je online wilt
const firebaseConfig = {
  apiKey: "VUL_HIER_JE_KEY_IN",
  authDomain: "JE_PROJECT.firebaseapp.com",
  databaseURL: "https://JE_PROJECT-default-rtdb.firebaseio.com",
  projectId: "JE_PROJECT",
  storageBucket: "JE_PROJECT.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};

let onlineMode = false;
let db, storyRef;

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  storyRef = db.ref("story");
  onlineMode = true;
  document.getElementById("status").textContent = "Online multiplayer modus";
} catch(e){
  console.log("Firebase niet geladen, offline modus actief");
}

// DOM elementen
const storyDiv = document.getElementById("story");
const input = document.getElementById("text");
const nameInput = document.getElementById("name");
const btn = document.getElementById("sendBtn");

// Offline storage
let storyLines = JSON.parse(localStorage.getItem("storyLines") || "[]");

function renderStory(){
  storyDiv.innerHTML = "";
  storyLines.forEach(line=>{
    const div=document.createElement("div");
    div.className="line";
    div.textContent=`${line.name}: ${line.text}`;
    storyDiv.appendChild(div);
  });
  storyDiv.scrollTop = storyDiv.scrollHeight;
}

function send(){
  const name = nameInput.value.trim() || "Anon";
  const text = input.value.trim();
  if(!text) return;
  const line = {name,text};

  storyLines.push(line);
  localStorage.setItem("storyLines",JSON.stringify(storyLines));
  renderStory();

  if(onlineMode){
    storyRef.push(line);
  }

  input.value="";
}

// Event listeners
btn.addEventListener("click", send);
input.addEventListener("keydown", e=>{if(e.key==="Enter") send();});
nameInput.addEventListener("keydown", e=>{if(e.key==="Enter") send();});

// Online realtime updates
if(onlineMode){
  storyRef.on("child_added", snapshot=>{
    const val = snapshot.val();
    const exists = storyLines.some(l=>l.name===val.name && l.text===val.text);
    if(!exists){
      storyLines.push(val);
      renderStory();
    }
  });
}

// Init
renderStory();
</script>
</body>
</html>
