<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gravity Lab</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{
    background:radial-gradient(circle at top,#050914,#000);
    overflow:hidden;
    color:white;
}
canvas{
    display:block;
    margin:0 auto;
    background:linear-gradient(#050914,#02040a);
}
#hud{
    position:fixed;
    top:10px;
    width:100%;
    text-align:center;
    font-size:18px;
    letter-spacing:2px;
    color:#7ff;
}
</style>
</head>

<body>

<div id="hud">🎯 GRAVITY LAB — Kantel om de bal te bewegen</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;
function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

let tilt=0;
let gravity=0.3;

const ball={
    x:W/2,
    y:80,
    r:14,
    vx:0,
    vy:0
};

let platforms=[];
let goal={x:W/2,y:H-80,r:20};

function createLevel(){
    platforms=[];
    let y=140;
    for(let i=0;i<9;i++){
        platforms.push({
            x:Math.random()*(W-200)+100,
            y:y,
            w:200,
            h:14
        });
        y+=70;
    }
}
createLevel();

document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") tilt=-0.5;
    if(e.key==="ArrowRight") tilt=0.5;
});
document.addEventListener("keyup",()=>tilt=0);

window.addEventListener("deviceorientation",e=>{
    if(e.gamma!==null){
        tilt=e.gamma/40;
    }
});

function update(){
    ball.vx+=tilt;
    ball.vy+=gravity;

    ball.vx*=0.995;
    ball.vy*=0.995;

    ball.x+=ball.vx;
    ball.y+=ball.vy;

    if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-0.6;}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-0.6;}

    platforms.forEach(p=>{
        if(ball.x>p.x && ball.x<p.x+p.w &&
           ball.y+ball.r>p.y && ball.y+ball.r<p.y+p.h+ball.vy){
            ball.y=p.y-ball.r;
            ball.vy*=-0.4;
        }
    });

    draw();
    requestAnimationFrame(update);
}

function draw(){
    ctx.clearRect(0,0,W,H);

    ctx.fillStyle="#00f7ff";
    ctx.shadowBlur=20;
    ctx.shadowColor="#00f7ff";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;
    ctx.fillStyle="#0ff";
    platforms.forEach(p=>{
        ctx.fillRect(p.x,p.y,p.w,p.h);
    });

    ctx.strokeStyle="#ff00ff";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(goal.x,goal.y,goal.r,0,Math.PI*2);
    ctx.stroke();

    let dx=ball.x-goal.x;
    let dy=ball.y-goal.y;
    if(Math.hypot(dx,dy)<goal.r){
        nextLevel();
    }
}

function nextLevel(){
    ball.x=W/2;
    ball.y=60;
    ball.vx=ball.vy=0;
    createLevel();
}

update();
</script>

</body>
</html>
