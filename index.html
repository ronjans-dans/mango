<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural City Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
body{
    background:radial-gradient(circle at top,#050014,#000);
    color:white;
    overflow:hidden;
    text-align:center;
}
h1{
    margin:15px;
    background:linear-gradient(90deg,#00f7ff,#ff00ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
canvas{
    display:block;
    margin:0 auto;
    border-radius:15px;
    box-shadow:0 0 40px rgba(0,255,255,.4);
    background:#000;
}
#ui{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
}
button{
    padding:14px 30px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#00f7ff,#ff00ff);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,0,255,.6);
}
button:hover{transform:scale(1.05);}
</style>
</head>

<body>

<h1>🏙 Procedural City Generator</h1>
<canvas id="city" width="1000" height="600"></canvas>

<div id="ui">
    <button onclick="generateCity()">Generate New City 🌆</button>
</div>

<script>
const canvas = document.getElementById("city");
const ctx = canvas.getContext("2d");

let time = 0;

function rand(min,max){return Math.random()*(max-min)+min}

function drawSky(){
    let grad = ctx.createLinearGradient(0,0,0,canvas.height);
    if(time<0.5){
        grad.addColorStop(0,"#001");
        grad.addColorStop(1,"#112");
    }else{
        grad.addColorStop(0,"#0a0015");
        grad.addColorStop(1,"#000");
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawStars(){
    if(time<0.5) return;
    for(let i=0;i<150;i++){
        ctx.fillStyle="rgba(255,255,255,.7)";
        ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height/2,2,2);
    }
}

function drawMoon(){
    if(time<0.5) return;
    ctx.beginPath();
    ctx.arc(100,100,40,0,Math.PI*2);
    ctx.fillStyle="#eee";
    ctx.shadowBlur=20;
    ctx.shadowColor="#fff";
    ctx.fill();
    ctx.shadowBlur=0;
}

function drawSun(){
    if(time>=0.5) return;
    ctx.beginPath();
    ctx.arc(100,100,45,0,Math.PI*2);
    ctx.fillStyle="#ffcc00";
    ctx.shadowBlur=25;
    ctx.shadowColor="#ffaa00";
    ctx.fill();
    ctx.shadowBlur=0;
}

function drawRoad(y){
    ctx.fillStyle="#111";
    ctx.fillRect(0,y,canvas.width,70);
    ctx.strokeStyle="#555";
    ctx.setLineDash([20,15]);
    ctx.beginPath();
    ctx.moveTo(0,y+35);
    ctx.lineTo(canvas.width,y+35);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawBuilding(x,w,h){
    let base = time<0.5?"#222":"#080010";
    ctx.fillStyle=base;
    ctx.fillRect(x,canvas.height-h,w,h);

    let rows = Math.floor(h/25);
    let cols = Math.floor(w/20);
    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
            if(Math.random()>0.45){
                ctx.fillStyle=time<0.5?"#444":"#00f7ff";
                ctx.fillRect(x+5+c*20,canvas.height-h+5+r*25,12,16);
            }
        }
    }
}

function generateCity(){
    time = Math.random();

    drawSky();
    drawStars();
    drawSun();
    drawMoon();

    drawRoad(canvas.height-80);

    let layers = 3;
    for(let l=0;l<layers;l++){
        let depth = (l+1)/layers;
        let yOffset = depth*120;
        let x=0;
        while(x<canvas.width){
            let w = rand(60,160);
            let h = rand(100,420)*depth;
            drawBuilding(x,w,h);
            x+=w+rand(10,40);
        }
    }
}

generateCity();
</script>

</body>
</html>
