<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking Challenge</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{
    background:radial-gradient(circle,#020024,#000);
    color:white;
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px;
    background:linear-gradient(90deg,#00f7ff,#ff00ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

canvas{
    background:#111;
    border-radius:16px;
    box-shadow:0 0 30px rgba(0,255,255,.4);
}

#ui{
    position:fixed;
    bottom:15px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#00f7ff,#ff00ff);
    font-size:18px;
    font-weight:700;
}

#msg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:28px;
}
.hidden{display:none;}
</style>
</head>

<body>

<h1>🚗 Parking Challenge</h1>
<canvas id="game" width="420" height="720"></canvas>

<div id="ui">
    <button ontouchstart="keys.left=true" ontouchend="keys.left=false">⬅️</button>
    <button ontouchstart="keys.up=true" ontouchend="keys.up=false">⬆️</button>
    <button ontouchstart="keys.down=true" ontouchend="keys.down=false">⬇️</button>
    <button ontouchstart="keys.right=true" ontouchend="keys.right=false">➡️</button>
</div>

<div id="msg" class="hidden">
    <div id="text"></div><br>
    <button onclick="reset()">Opnieuw</button>
</div>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let car, obstacles, parking, speed = 0, angle = 0, playing=true;

const keys = {left:false,right:false,up:false,down:false};

document.addEventListener("keydown",e=>{
    if(e.key=="ArrowLeft") keys.left=true;
    if(e.key=="ArrowRight") keys.right=true;
    if(e.key=="ArrowUp") keys.up=true;
    if(e.key=="ArrowDown") keys.down=true;
});

document.addEventListener("keyup",e=>{
    if(e.key=="ArrowLeft") keys.left=false;
    if(e.key=="ArrowRight") keys.right=false;
    if(e.key=="ArrowUp") keys.up=false;
    if(e.key=="ArrowDown") keys.down=false;
});

function reset(){
    car={x:200,y:600,w:30,h:50};
    speed=0;
    angle=0;
    obstacles=[
        {x:80,y:300,w:60,h:120},
        {x:280,y:260,w:60,h:150},
        {x:130,y:100,w:160,h:80}
    ];
    parking={x:150,y:30,w:120,h:70};
    playing=true;
    document.getElementById("msg").classList.add("hidden");
}
reset();

function drawCar(){
    ctx.save();
    ctx.translate(car.x,car.y);
    ctx.rotate(angle);
    ctx.fillStyle="#00f7ff";
    ctx.fillRect(-car.w/2,-car.h/2,car.w,car.h);
    ctx.restore();
}

function update(){
    if(!playing) return;

    if(keys.up) speed+=0.05;
    if(keys.down) speed-=0.05;
    speed*=0.98;
    speed=Math.max(Math.min(speed,4),-2);

    if(keys.left) angle-=0.05;
    if(keys.right) angle+=0.05;

    car.x += Math.sin(angle)*speed;
    car.y -= Math.cos(angle)*speed;

    car.x=Math.max(15,Math.min(c.width-15,car.x));
    car.y=Math.max(25,Math.min(c.height-25,car.y));

    checkCollision();
    draw();
    requestAnimationFrame(update);
}

function draw(){
    ctx.clearRect(0,0,c.width,c.height);

    ctx.fillStyle="#0a0a0a";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.strokeStyle="#00f7ff";
    ctx.strokeRect(parking.x,parking.y,parking.w,parking.h);
    ctx.fillStyle="rgba(0,255,255,.1)";
    ctx.fillRect(parking.x,parking.y,parking.w,parking.h);

    ctx.fillStyle="#ff00ff";
    obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));

    drawCar();
}

function rectsOverlap(a,b){
    return a.x<a.x+a.w &&
           a.x+a.w>b.x &&
           a.y<a.y+a.h &&
           a.y+a.h>b.y;
}

function checkCollision(){
    let box={x:car.x-car.w/2,y:car.y-car.h/2,w:car.w,h:car.h};

    for(let o of obstacles){
        if(box.x<o.x+o.w && box.x+box.w>o.x &&
           box.y<o.y+o.h && box.y+box.h>o.y){
            lose();
        }
    }

    if(box.x>parking.x && box.x+box.w<parking.x+parking.w &&
       box.y>parking.y && box.y+box.h<parking.y+parking.h &&
       Math.abs(speed)<0.5){
        win();
    }
}

function win(){
    playing=false;
    show("PERFECT GEPAKKEERD 🅿️");
}

function lose(){
    playing=false;
    show("BOTSING 💥");
}

function show(t){
    document.getElementById("text").textContent=t;
    document.getElementById("msg").classList.remove("hidden");
}

update();
</script>

</body>
</html>
