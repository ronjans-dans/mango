<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Verhalen Spel</title>

<style>
body{
    margin:0;
    font-family:system-ui,Segoe UI,Arial;
    background:radial-gradient(circle at top,#090018,#000);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

#app{
    width:95%;
    max-width:900px;
    background:rgba(0,0,0,0.6);
    border-radius:18px;
    padding:20px;
    box-shadow:0 0 40px rgba(0,255,255,0.15);
}

h1{
    text-align:center;
    margin-bottom:15px;
    color:#00ffee;
}

#story{
    background:#050505;
    border-radius:14px;
    padding:15px;
    min-height:260px;
    max-height:420px;
    overflow-y:auto;
    font-size:18px;
    line-height:1.6;
    box-shadow:inset 0 0 20px rgba(0,255,255,0.1);
}

.line{
    margin-bottom:10px;
    animation:fade .4s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
}

#controls{
    display:flex;
    gap:10px;
    margin-top:15px;
}

input{
    flex:1;
    padding:12px 14px;
    border-radius:10px;
    border:none;
    outline:none;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00ffee,#00ff99);
    font-weight:700;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.1);
}

#status{
    text-align:center;
    font-size:12px;
    margin-top:6px;
    opacity:.7;
}
</style>
</head>

<body>

<div id="app">
    <h1>🌍 Online Verhalen Spel</h1>
    <div id="story"></div>

    <div id="controls">
        <input id="text" placeholder="Schrijf jouw zin..." maxlength="140">
        <button onclick="send()">Verstuur</button>
    </div>

    <div id="status">Live multiplayer verbonden</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<script>
// 🔧 FIREBASE CONFIG — vervang dit met jouw eigen Firebase keys
const firebaseConfig = {
  apiKey: "VUL_HIER_JE_KEY_IN",
  authDomain: "VUL_HIER_IN.firebaseapp.com",
  databaseURL: "https://VUL_HIER_IN-default-rtdb.firebaseio.com",
  projectId: "VUL_HIER_IN",
  storageBucket: "VUL_HIER_IN.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storyRef = ref(db, "story");

const story = document.getElementById("story");
const input = document.getElementById("text");

function send(){
    if(input.value.trim()=="") return;
    push(storyRef, input.value.trim());
    input.value="";
}

input.addEventListener("keydown",e=>{
    if(e.key==="Enter") send();
});

onChildAdded(storyRef,snap=>{
    const div=document.createElement("div");
    div.className="line";
    div.textContent=snap.val();
    story.appendChild(div);
    story.scrollTop=story.scrollHeight;
});
</script>

</body>
</html>
