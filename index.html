<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Space Dodger</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
body{
    background:radial-gradient(circle at top,#06001a,#000);
    overflow:hidden;
    color:white;
    text-align:center;
}

h1{
    margin-top:15px;
    background:linear-gradient(90deg,#00f7ff,#ff00ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

canvas{
    display:block;
    margin:20px auto;
    background:rgba(255,255,255,0.05);
    border-radius:16px;
    box-shadow:0 0 40px rgba(0,255,255,0.5);
}

#ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:30px;
    font-size:18px;
}

button{
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#00f7ff,#ff00ff);
    font-weight:700;
    cursor:pointer;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.hidden{display:none;}
</style>
</head>

<body>

<h1>🚀 Neon Space Dodger</h1>

<div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Highscore: <span id="high">0</span></div>
</div>

<canvas id="game" width="420" height="640"></canvas>

<div id="overlay">
    <h1>Neon Space Dodger</h1>
    <p>Ontwijk de blokken. Hoe langer je leeft, hoe moeilijker!</p><br>
    <button onclick="startGame()">START</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, obstacles, score, speed, playing=false;
let highscore = localStorage.getItem("highscore") || 0;
document.getElementById("high").textContent = highscore;

function startGame(){
    player = {x:canvas.width/2-20,y:canvas.height-80,w:40,h:40,speed:6};
    obstacles=[];
    score=0;
    speed=3;
    playing=true;
    document.getElementById("overlay").classList.add("hidden");
    loop();
}

document.addEventListener("keydown",e=>{
    if(e.key=="ArrowLeft") player.x-=player.speed;
    if(e.key=="ArrowRight") player.x+=player.speed;
});

canvas.addEventListener("touchmove",e=>{
    let rect = canvas.getBoundingClientRect();
    player.x = e.touches[0].clientX - rect.left - player.w/2;
});

function spawnObstacle(){
    let size = 20 + Math.random()*40;
    obstacles.push({
        x:Math.random()*(canvas.width-size),
        y:-size,
        w:size,
        h:size
    });
}

function drawPlayer(){
    ctx.fillStyle="#00f7ff";
    ctx.shadowBlur=20;
    ctx.shadowColor="#00f7ff";
    ctx.fillRect(player.x,player.y,player.w,player.h);
}

function drawObstacles(){
    ctx.fillStyle="#ff00ff";
    ctx.shadowBlur=20;
    ctx.shadowColor="#ff00ff";
    obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));
}

function update(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawPlayer();
    drawObstacles();

    obstacles.forEach(o=>o.y+=speed);

    obstacles = obstacles.filter(o=>o.y<canvas.height+50);

    if(Math.random()<0.03) spawnObstacle();

    obstacles.forEach(o=>{
        if(player.x<o.x+o.w &&
           player.x+player.w>o.x &&
           player.y<o.y+o.h &&
           player.y+player.h>o.y){
            gameOver();
        }
    });

    score++;
    speed += 0.0005;

    document.getElementById("score").textContent = score;
}

function loop(){
    if(!playing) return;
    update();
    requestAnimationFrame(loop);
}

function gameOver(){
    playing=false;
    if(score>highscore){
        highscore=score;
        localStorage.setItem("highscore",highscore);
    }
    document.getElementById("high").textContent=highscore;
    document.getElementById("overlay").classList.remove("hidden");
}
</script>

</body>
</html>
