<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Night Drive Simulator</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
    background:radial-gradient(circle at top,#02050a,#000);
    overflow:hidden;
    color:white;
}
canvas{
    display:block;
    margin:0 auto;
}
#ui{
    position:fixed;
    bottom:15px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:15px;
    z-index:10;
}
button{
    padding:14px 20px;
    border:none;
    border-radius:12px;
    background:rgba(0,255,255,.15);
    color:white;
    font-size:18px;
    backdrop-filter:blur(6px);
}
#hud{
    position:fixed;
    top:10px;
    width:100%;
    text-align:center;
    font-size:18px;
    letter-spacing:2px;
    color:#8ff;
}
</style>
</head>

<body>

<div id="hud">🌧 NIGHT DRIVE SIMULATOR</div>
<canvas id="game"></canvas>

<div id="ui">
    <button ontouchstart="keys.left=true" ontouchend="keys.left=false">⬅</button>
    <button ontouchstart="keys.up=true" ontouchend="keys.up=false">⬆</button>
    <button ontouchstart="keys.down=true" ontouchend="keys.down=false">⬇</button>
    <button ontouchstart="keys.right=true" ontouchend="keys.right=false">➡</button>
</div>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let W,H;
function resize(){
    W=c.width=window.innerWidth;
    H=c.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

const keys={left:false,right:false,up:false,down:false};
document.addEventListener("keydown",e=>{
    if(e.key.includes("Arrow")) keys[e.key.replace("Arrow","").toLowerCase()]=true;
});
document.addEventListener("keyup",e=>{
    if(e.key.includes("Arrow")) keys[e.key.replace("Arrow","").toLowerCase()]=false;
});

let car={x:0,y:0,angle:0,speed:0};

let roadOffset=0;
let rain=[];

for(let i=0;i<400;i++){
    rain.push({
        x:Math.random()*W,
        y:Math.random()*H,
        s:4+Math.random()*6,
        l:10+Math.random()*15
    });
}

function drawSky(){
    let g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#02060d");
    g.addColorStop(1,"#000");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
}

function drawRoad(){
    let center=W/2;
    ctx.fillStyle="#080b10";
    ctx.beginPath();
    ctx.moveTo(center-200,H);
    ctx.lineTo(center+200,H);
    ctx.lineTo(center+60,0);
    ctx.lineTo(center-60,0);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle="rgba(255,255,255,.3)";
    ctx.setLineDash([40,40]);
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(center,0);
    ctx.lineTo(center,H);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawBuildings(){
    for(let i=0;i<50;i++){
        let x=i*120+(roadOffset%120)-200;
        let h=150+Math.random()*300;
        ctx.fillStyle="rgba(0,20,40,.9)";
        ctx.fillRect(x, H-h, 80, h);

        for(let y=H-h+10;y<H-10;y+=25){
            if(Math.random()>0.6){
                ctx.fillStyle="#0ff";
                ctx.fillRect(x+10,y,10,12);
            }
        }
    }
}

function drawCar(){
    ctx.save();
    ctx.translate(W/2,H*0.75);
    ctx.rotate(car.angle);
    ctx.fillStyle="#0ff";
    ctx.shadowBlur=30;
    ctx.shadowColor="#0ff";
    ctx.fillRect(-14,-25,28,50);
    ctx.restore();
}

function drawRain(){
    ctx.strokeStyle="rgba(150,200,255,.35)";
    ctx.lineWidth=1;
    rain.forEach(r=>{
        ctx.beginPath();
        ctx.moveTo(r.x,r.y);
        ctx.lineTo(r.x-2,r.y+r.l);
        ctx.stroke();
        r.y+=r.s;
        if(r.y>H){
            r.y=-20;
            r.x=Math.random()*W;
        }
    });
}

function update(){
    if(keys.up) car.speed+=0.05;
    if(keys.down) car.speed-=0.05;
    car.speed*=0.98;
    car.speed=Math.max(Math.min(car.speed,5),-2);

    if(keys.left) car.angle-=0.03;
    if(keys.right) car.angle+=0.03;

    roadOffset+=car.speed*4;

    drawSky();
    drawBuildings();
    drawRoad();
    drawRain();
    drawCar();

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
